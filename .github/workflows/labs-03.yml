name: Deploy Lambda Direct

on:
  push:
    branches:
      - labs-03

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LAMBDA_FUNCTION_NAME: ${{ secrets.FUNCTION_NAME || 'lab03-1-function1' }}
      TABLE_NAME: ${{ secrets.TABLE_NAME || 'lab03-1-table1' }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-region: us-east-2

    - name: Deploy stack (CloudFormation)
      run: |
        aws cloudformation deploy \
          --template-file plantillas-aws/lab-03.1-full.yml \
          --stack-name lab03-events \
          --parameter-overrides FunctionName=$LAMBDA_FUNCTION_NAME TableName=$TABLE_NAME \
          --capabilities CAPABILITY_NAMED_IAM \
          --no-fail-on-empty-changeset

    - name: Zip code
      run: |
        LAMBDA_DIR="labs/labs-03-pipelines-github-cloud/lab-03.1"
        cd $LAMBDA_DIR
        zip -r $GITHUB_WORKSPACE/function.zip .

    - name: Verify zip exists
      run: |
        ls -lh function.zip
        unzip -l function.zip

    - name: Deploy to Lambda
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
          --zip-file fileb://function.zip

    - name: Invoke Lambda (escribir evento en DynamoDB)
      run: |
        echo '{"action":"putEvent","body":{"eventType":"lab-run","source":"github-actions"}}' > payload-put.json
        aws lambda invoke \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
          --payload fileb://payload-put.json \
          response-put.json
        cat response-put.json

    - name: Invoke Lambda (listar eventos desde DynamoDB)
      run: |
        echo '{"action":"listEvents"}' > payload-list.json
        aws lambda invoke \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
          --payload fileb://payload-list.json \
          response-list.json
        cat response-list.json

    - name: Verificar respuesta
      run: |
        echo "=== Respuesta put ==="
        cat response-put.json | head -1
        echo ""
        echo "=== Respuesta list (primeros 500 chars) ==="
        cat response-list.json | head -c 500
        echo ""
        if grep -q '"statusCode":200' response-put.json && grep -q '"statusCode":200' response-list.json; then
          echo "OK: Ambas invocaciones devolvieron 200"
        else
          echo "Verificar: una invocación no devolvió 200"
          exit 1
        fi